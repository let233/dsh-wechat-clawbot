name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 安装测试期依赖（不进产物）
        run: npm i --no-save react@18 react-dom@18 jsdom qrcode-generator jsqr
      - name: 语法检查
        run: |
          for f in lib/*.js; do node --check "$f"; done
      - name: 全部测试
        run: |
          for f in test/*.test.mjs; do
            echo "== $f"
            node "$f"
          done
      - name: 客户端渲染测试（jsdom）
        run: node test/render-client.mjs
